spring:
  application:
    name: diarionutrizionale

  # Predefinito: Postgres locale in Docker.
  # Per Supabase:  -Dspring-boot.run.profiles=supabase
  datasource:
    url: jdbc:postgresql://localhost:5433/diario
    username: diario
    password: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  # In locale 8080. Su Render (e su quasi ogni PaaS) la porta la
  # assegna la piattaforma tramite la variabile PORT.
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # secure: true  -> attivare quando sei dietro HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    pj.eu.diarionutrizionale: DEBUG
    # Utile mentre si sistema l'accesso; da togliere dopo.
    org.springframework.security: DEBUG
