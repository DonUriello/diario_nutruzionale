spring:
  application:
    name: nutri

  # Predefinito: Postgres locale in Docker.
  # Per Supabase:  -Dspring-boot.run.profiles=supabase
  datasource:
    url: jdbc:postgresql://localhost:5433/nutri
    username: nutri
    password: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # secure: true  -> attivare quando sei dietro HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    it.elia.nutri: DEBUG
